name: Chezmoi verify
on:
  push:
    paths:
      - "home/**"
      - ".chezmoiroot"
      - "scripts/lib.sh"
      - "scripts/chezmoi/**"
      - "config.sh"
  pull_request:
    paths:
      - "home/**"
      - ".chezmoiroot"
      - "scripts/lib.sh"
      - "scripts/chezmoi/**"
      - "config.sh"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsSL get.chezmoi.io)" -- -b "$HOME/bin"
      - name: Add chezmoi to PATH
        run: echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Init + managed files (cloud profile)
        env:
          CHEZMOI_PROFILE: cloud
          CHEZMOI_NON_INTERACTIVE: "1"
        run: |
          # Point source at this checkout (monorepo = content + home/)
          mkdir -p "$HOME/.local/share"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init --force
          chezmoi managed | tee /tmp/managed.txt
          test "$(wc -l < /tmp/managed.txt)" -gt 5
          grep -q 'dot_dir' "$HOME/.config/chezmoi/chezmoi.toml"
          grep -F "$GITHUB_WORKSPACE" "$HOME/.config/chezmoi/chezmoi.toml"
      - name: Template dry-run (no apply scripts)
        env:
          CHEZMOI_PROFILE: cloud
          CHEZMOI_NON_INTERACTIVE: "1"
        run: |
          mkdir -p /tmp/chezmoi-dest
          chezmoi --destination /tmp/chezmoi-dest apply --exclude scripts
          test -f /tmp/chezmoi-dest/.zshrc
          grep -F "$GITHUB_WORKSPACE" /tmp/chezmoi-dest/.zshrc
